name: deploy

# Every pull request and every push to main runs the checks. A push to main then
# publishes an image to GHCR, and the box pulls it within two minutes
# (deploy/README.md). This workflow never connects to the box, and must never be
# given a key that would let it.

on:
  push:
    branches: [main]
  pull_request:
  # GitHub can drop a push event, and main refuses direct pushes, so nothing
  # else could re-trigger one. `gh workflow run deploy.yml -R estiva-app/leaf
  # --ref main` publishes main as it stands; from any other ref it only checks.
  workflow_dispatch:

concurrency:
  group: deploy-leaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck the app
        run: npx tsc -b tsconfig.app.json
      - name: Typecheck the settings files
        run: npx tsc -b tsconfig.node.json
      - name: Lint — everything, the token contract included
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # A class only a package part uses reaches the stylesheet only if
      # tailwind.config.js spreads estivaContent. When it does not, the build still
      # succeeds and parts render at the wrong size, so this is where it is caught.
      - name: The package's classes survive Tailwind's purge
        run: |
          if ! grep -qr "max-h-72" dist/assets/*.css; then
            echo "::error::a class used only by @estiva-app/ui is missing from the built CSS — check estivaContent is spread into tailwind.config.js"
            exit 1
          fi

  # The UI Guardrails, the one check a merge requires: the package's gate rules
  # (each refusal names what to use instead), the token contract, and the
  # catalogue. `npm run lint:rules` also writes .gates-count.json and fails on
  # an eslint-disable that switches a rule off.
  #
  # A job of its own, because GitHub can require only a whole job, by its name:
  # the rule on main requires `gate`. Renaming it leaves every pull request
  # waiting for a check that never reports.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every step of the gate, the same command Peek and Ship run: the gate
      # lint and `.gates-count.json` (committed, or this fails), the token
      # contract, the catalogue (every part says in one line what it is for),
      # and the wall's own settings: the editor hook in .claude/settings.json
      # refuses a raw button, and every folder the gate skips is named in
      # docs/GATES-DEBT.md.
      - name: The gate (estiva-gates ci)
        run: npx estiva-gates ci

  # The box pulls `:main` from a systemd timer with nobody watching, so a publish
  # is a deploy: every check that can stop a broken bundle stops this.
  publish:
    needs: [check, gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The image is an envelope for dist/, as Ship's and Peek's are. The relay
      # URL is the workspace, so it is baked into the bundle rather than read at
      # runtime; changing where it points is a rebuild, by design. The client id
      # must match a `client_id` seeded in Estiva ID, or sign-in answers
      # "Unknown or disabled app".
      - name: Build
        run: npm run build
        env:
          VITE_ESTIVA_ID_ORIGIN: https://id.estiva.app
          VITE_ESTIVA_ID_CLIENT_ID: estiva-leaf
          VITE_RELAY_URL: https://estiva.estiva.app

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `main` is what the box tracks; the sha tag is what makes a rollback
          # possible without rebuilding.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
