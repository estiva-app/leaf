# Leaf, served at the root of leaf.estiva.app. The same as Ship's.
#
# TLS, compression and caching at the edge are Cloudflare's job: this server
# sees plain HTTP from `cloudflared` on the loopback and does as little as
# possible.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real client addresses do not survive the tunnel, so the access log records
    # the Docker bridge gateway. Keep it for request paths only.
    access_log /var/log/nginx/access.log;

    # A deep link has to reach index.html and let the app route it, or a
    # pasted link breaks on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite names every asset by its content hash, so a changed file is a changed
    # URL and a stale one is never requested. Cache those hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
